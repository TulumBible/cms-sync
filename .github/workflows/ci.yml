name: CI

# Type-check on every PR and on pushes that touch code — the sync
# workflow itself only runs on cron/dispatch, so without this nothing
# validates a change before it lands on main.
on:
  pull_request:
  push:
    branches: [main, draft]
    paths:
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      # Same SHA pins as sync.yml — keep the two files in step when bumping.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      - name: Test
        run: pnpm test
